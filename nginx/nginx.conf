worker_processes  1;
pid /tmp/cn-nginx.pid;

error_log /tmp/cn-nginx-error.log;
events {
    worker_connections  256;
}

http {
    access_log /tmp/cn-nginx-access.log;

    upstream backend_pool {
    server 10.7.11.153:3001;
    server 10.7.18.204:3002;
}

    server {
        listen 8443 ssl;
        server_name app.team1.test api.team1.test;

        ssl_certificate     /Users/Kushagra/cn-project/certs/server.crt;
        ssl_certificate_key /Users/Kushagra/cn-project/certs/server.key;

        # TLS 1.2 makes the handshake easier to inspect
        # for this course demonstration.
        ssl_protocols TLSv1.2;

        location / {
            proxy_pass http://backend_pool;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
